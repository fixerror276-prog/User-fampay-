<!DOCTYPE html>
<html>
<head>
    <title>Pay ₹{{ order.amount }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh; overflow-x: hidden; color: white;
            background: #0a0a1a;
        }
        .video-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: -2;
        }
        .overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(10, 5, 30, 0.7), rgba(40, 10, 60, 0.75));
            z-index: -1;
        }
        .container {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 25px;
            padding: 30px 25px;
            width: 100%; max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            animation: floatIn 0.8s ease-out;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center; font-size: 26px; margin-bottom: 5px;
            background: linear-gradient(135deg, #f093fb, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .order-id {
            text-align: center; font-size: 12px;
            opacity: 0.7; margin-bottom: 15px;
        }
        .amount {
            text-align: center; font-size: 42px; font-weight: bold;
            margin: 10px 0 20px;
            background: linear-gradient(135deg, #38ef7d, #11998e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .qr-box {
            background: white; padding: 15px;
            border-radius: 20px; text-align: center;
            margin: 15px 0;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
        }
        .qr-box img { width: 100%; max-width: 240px; border-radius: 10px; }
        .upi-info {
            text-align: center; font-size: 13px;
            opacity: 0.85; margin-bottom: 20px;
        }
        .upi-info strong { color: #4facfe; }
        .utr-box label {
            display: block; margin-bottom: 8px;
            font-size: 14px; opacity: 0.9;
        }
        .utr-box input {
            width: 100%; padding: 15px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: white; font-size: 16px;
            outline: none; transition: border 0.3s;
        }
        .utr-box input:focus { border-color: #4facfe; }
        .utr-box button {
            width: 100%; margin-top: 12px; padding: 15px;
            border: none; border-radius: 12px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: transform 0.2s;
        }
        .utr-box button:hover { transform: scale(1.02); }
        .utr-box button:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            margin-top: 15px; padding: 15px;
            border-radius: 12px; text-align: center;
            font-size: 14px; display: none;
        }
        .message.success {
            background: rgba(56,239,125,0.2);
            border: 1px solid #38ef7d; color: #38ef7d; display: block;
        }
        .message.error {
            background: rgba(255,107,107,0.2);
            border: 1px solid #ff6b6b; color: #ff6b6b; display: block;
        }
        .hint {
            font-size: 12px; opacity: 0.7;
            text-align: center; margin-top: 10px;
        }
    </style>
</head>
<body>
    {% if bg_video_url %}
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="{{ bg_video_url }}" type="video/mp4">
    </video>
    {% endif %}
    <div class="overlay"></div>

    <div class="container">
        <div class="card">
            <h1>💳 Payment</h1>
            <p class="order-id">Order: {{ order.order_id }}</p>
            <div class="amount">₹{{ order.amount }}</div>

            <div class="qr-box">
                <img src="{{ qr_url }}" alt="QR Code">
            </div>

            <p class="upi-info">
                Scan QR or pay to:<br>
                <strong>{{ upi_id }}</strong>
            </p>

            <div class="utr-box">
                <label>📋 UTR Number (12 digit)</label>
                <input type="text" id="utr" placeholder="003476573233" maxlength="15">
                <button onclick="submitUTR()" id="submitBtn">Submit & Verify</button>
                <p class="hint">Payment ke baad UPI app se UTR copy karke yahan paste karo</p>
                <div class="message" id="msg"></div>
            </div>
        </div>
    </div>

    <script>
        async function submitUTR() {
            const utr = document.getElementById('utr').value.trim();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');

            if (!utr || utr.length < 10) {
                msg.className = 'message error';
                msg.textContent = 'Sahi UTR daalo (12 digit)';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying...';
            msg.className = 'message';
            msg.textContent = '';

            try {
                const res = await fetch('/api/submit-utr', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({order_id: '{{ order.order_id }}', utr: utr})
                });
                const data = await res.json();

                if (data.success) {
                    msg.className = 'message success';
                    msg.innerHTML = '✅ Payment Successful!<br>₹' + data.data.money + ' received';
                    btn.textContent = 'Verified ✅';
                } else {
                    msg.className = 'message error';
                    msg.textContent = '❌ ' + (data.message || data.error);
                    btn.disabled = false;
                    btn.textContent = 'Submit & Verify';
                }
            } catch (e) {
                msg.className = 'message error';
                msg.textContent = 'Error: ' + e.message;
                btn.disabled = false;
                btn.textContent = 'Submit & Verify';
            }
        }
    </script>
</body>
  </html>
